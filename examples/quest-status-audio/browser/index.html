<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
  <title>Quest status and audio</title>
  <link rel="icon" href="./icons/quest-audio-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="companion">
    <h1>Quest status and audio</h1>

    <section aria-labelledby="connection-heading">
      <div class="section-heading">
        <h2 id="connection-heading">Headset connection</h2>
        <p id="connection" class="connection" data-phase="disconnected" aria-live="polite">Disconnected</p>
      </div>

      <form id="pair-form" autocomplete="off">
        <p id="pair-help">Start a session in the headset app and enter its pairing code.</p>
        <label for="pairing-code">Pairing code</label>
        <div class="pairing-controls">
          <input id="pairing-code" type="password" aria-describedby="pair-help" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="32 characters" maxlength="32" required>
          <button id="pair" class="primary" type="submit">Pair headset</button>
        </div>
      </form>
      <button id="disconnect" type="button" hidden>Disconnect</button>
      <noscript>Enable JavaScript to connect to the headset.</noscript>
    </section>

    <section aria-labelledby="audio-heading">
      <div class="section-heading">
        <h2 id="audio-heading">Test clip</h2>
        <p class="playback" aria-live="polite">Last reported: <span id="playback">Unavailable</span></p>
      </div>
      <div class="actions">
        <button id="play" class="primary" type="button" disabled>Play test clip</button>
        <button id="stop" type="button" disabled>Stop playback</button>
        <button id="refresh" type="button" disabled>Refresh status</button>
      </div>
      <p id="note" class="note" role="status" aria-atomic="true"></p>
      <button id="dismiss" type="button" hidden>Dismiss saved request</button>
    </section>
  </main>
</body>
</html>
