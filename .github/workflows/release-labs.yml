name: Release Labs APK bundle

on:
  push:
    tags:
      - "v*-alpha.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing Labs candidate tag without v, for example 0.6.6-alpha.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-labs:
    runs-on: windows-2025
    environment: android-labs-release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve immutable Labs candidate source
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_REPOSITORY -cne 'MesmerPrism/Rusty-Kiosk') {
            throw 'Labs owner publication is authorized only for MesmerPrism/Rusty-Kiosk.'
          }
          Import-Module .\tools\RustyKiosk.ReleaseVersion.psm1 -Force
          $semanticVersion = if ($env:EVENT_NAME -ceq 'workflow_dispatch') {
            $env:INPUT_VERSION
          } else {
            $env:EVENT_REF_NAME -replace '^v', ''
          }
          $release = Resolve-RustyKioskReleaseVersion `
            -Version $semanticVersion `
            -ExpectedChannel labs
          $expectedRef = "refs/tags/$($release.Tag)"
          if ($env:EVENT_REF -cne $expectedRef) {
            throw "Labs publication must run from exact existing tag $expectedRef."
          }
          git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh authoritative remote tags.' }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh authoritative remote main.' }
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $tagCommit = (git rev-parse "$($release.Tag)^{commit}").Trim().ToLowerInvariant()
          $workflowSha = $env:WORKFLOW_SHA.ToLowerInvariant()
          if ($head -cne $tagCommit -or $head -cne $workflowSha) {
            throw "Tag, checkout, and workflow SHA differ: tag=$tagCommit head=$head workflow=$workflowSha"
          }
          $remote = @(git ls-remote --tags origin "refs/tags/$($release.Tag)" "refs/tags/$($release.Tag)^{}")
          if ($LASTEXITCODE -ne 0 -or $remote.Count -eq 0) {
            throw "Authoritative remote tag $($release.Tag) was not found."
          }
          $remoteCommits = @($remote | ForEach-Object {
            ($_ -split '\s+')[0].ToLowerInvariant()
          })
          if ($remoteCommits -notcontains $head) {
            throw "Remote tag $($release.Tag) does not peel to checked-out commit $head."
          }
          git merge-base --is-ancestor $head refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Labs tag commit $head is not reachable from authoritative remote main."
          }
          if (git status --porcelain --untracked-files=all) {
            throw 'The Labs release checkout must be clean.'
          }
          $tree = (git rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          "semantic_version=$($release.Version)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version_code=$($release.VersionCode)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_name=$($release.Tag)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_revision=$head" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_tree=$tree" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prove release tag is unused
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          # A missing release is the expected success condition here. GitHub's
          # PowerShell runner promotes non-zero native exits to terminating
          # errors unless this compatibility switch is disabled, which would
          # prevent us from inspecting the authoritative HTTP 404 below.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          $response = @(gh api -i "repos/$($env:RELEASE_REPOSITORY)/releases/tags/$tag" 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            throw "Release $tag already exists; Labs assets are append-never and replace-never."
          }
          if (($response -join "`n") -notmatch '(?m)^HTTP/\S+\s+404\b') {
            throw "Could not positively prove that release $tag is absent.`n$($response -join "`n")"
          }
          $authenticatedReleases = gh api --paginate --slurp `
            "repos/$($env:RELEASE_REPOSITORY)/releases?per_page=100" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not enumerate authenticated releases and drafts.'
          }
          $sameTagReleases = @(
            $authenticatedReleases | ForEach-Object { $_ } | Where-Object {
              $_.tag_name -ceq $tag
            }
          )
          if ($sameTagReleases.Count -ne 0) {
            throw "Release or draft $tag already exists; evidence is append-never and replace-never."
          }
          # GitHub Actions uses the final native exit code as the step result even
          # when PowerShell intentionally handled that expected 404 above.
          $global:LASTEXITCODE = 0

      - name: Restore Android signing identity
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw 'ANDROID_SIGNING_KEYSTORE_BASE64 is not configured.'
          }
          [IO.File]::WriteAllBytes(
            (Join-Path $env:RUNNER_TEMP 'rusty-kiosk-release.jks'),
            [Convert]::FromBase64String($env:KEYSTORE_BASE64))

      - name: Test and build the co-installable Labs pair
        shell: pwsh
        env:
          RUSTY_KIOSK_KEYSTORE_PATH: ${{ runner.temp }}\rusty-kiosk-release.jks
          RUSTY_KIOSK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          RUSTY_KIOSK_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          RUSTY_KIOSK_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          RUSTY_KIOSK_RELEASE_VERSION: ${{ steps.version.outputs.semantic_version }}
        run: |
          foreach ($value in @(
            $env:RUSTY_KIOSK_KEYSTORE_PASSWORD,
            $env:RUSTY_KIOSK_KEY_ALIAS,
            $env:RUSTY_KIOSK_KEY_PASSWORD)) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw 'Android signing passwords and key alias must be configured.'
            }
          }
          if (git status --porcelain --untracked-files=all) {
            throw 'The release checkout became dirty before the signing build.'
          }
          $env:ORG_GRADLE_PROJECT_rustyKioskReleaseVersion =
            $env:RUSTY_KIOSK_RELEASE_VERSION
          $env:ORG_GRADLE_PROJECT_rustyKioskProductChannel = 'labs'
          .\gradlew.bat test lint :app:assembleRelease :setup-helper:assembleRelease --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Gradle Labs release build failed.' }
          # The repository gate intentionally validates the source default as
          # stable; do not leak the just-built Labs Gradle projection into it.
          Remove-Item Env:ORG_GRADLE_PROJECT_rustyKioskReleaseVersion
          Remove-Item Env:ORG_GRADLE_PROJECT_rustyKioskProductChannel
          pwsh -NoProfile -File .\tools\check_repo.ps1 -SkipAssemble
          if ($LASTEXITCODE -ne 0) { throw 'Repository validation failed.' }

      - name: Verify identity and stage immutable Labs bundle
        shell: pwsh
        env:
          RELEASE_SOURCE_REVISION: ${{ steps.version.outputs.source_revision }}
          RELEASE_SOURCE_TREE: ${{ steps.version.outputs.source_tree }}
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.semantic_version }}
        run: |
          if (git status --porcelain --untracked-files=all) {
            throw 'The release checkout became dirty before identity verification and staging.'
          }
          $mainApk = (Get-ChildItem app\build\outputs\apk\release\*.apk | Select-Object -First 1).FullName
          $helperApk = (Get-ChildItem setup-helper\build\outputs\apk\release\*.apk | Select-Object -First 1).FullName
          if (-not $mainApk -or -not $helperApk) { throw 'Expected release APK outputs were not found.' }
          $apksigner = (Get-ChildItem "$env:ANDROID_HOME\build-tools\*\apksigner.bat" |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $aapt2 = (Get-ChildItem "$env:ANDROID_HOME\build-tools\*\aapt2.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $policy = Get-Content -Raw .\release\kiosk-release-signer-policy.v1.json |
            ConvertFrom-Json
          .\tools\Stage-ReleaseBundle.ps1 `
            -MainApkPath $mainApk `
            -SetupHelperApkPath $helperApk `
            -Version $env:RELEASE_VERSION `
            -ExpectedChannel labs `
            -ExpectedSignerSha256 $policy.authorized_signer_sha256 `
            -SourceRevision $env:RELEASE_SOURCE_REVISION `
            -SourceTree $env:RELEASE_SOURCE_TREE `
            -ApkSignerPath $apksigner `
            -Aapt2Path $aapt2
          .\tools\Test-KioskLabsOwnerMetadata.ps1 `
            -MetadataPath .\artifacts\release-bundle\rusty-kiosk-labs-owner-release.json `
            -ExpectedTag $env:RELEASE_TAG `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedSourceRevision $env:RELEASE_SOURCE_REVISION `
            -ExpectedSourceTree $env:RELEASE_SOURCE_TREE `
            -PrimaryArtifactPath .\artifacts\release-bundle\rusty-kiosk.apk `
            -BundleManifestPath .\artifacts\release-bundle\bundle-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rusty-kiosk-labs-${{ steps.version.outputs.semantic_version }}
          path: artifacts/release-bundle

      - name: Publish immutable GitHub prerelease draft, verify, and promote
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_REVISION: ${{ steps.version.outputs.source_revision }}
          RELEASE_SOURCE_TREE: ${{ steps.version.outputs.source_tree }}
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(Get-ChildItem artifacts\release-bundle -File | Sort-Object Name)
          $expectedNames = @(
            'RUSTY-KIOSK-LICENSE.txt',
            'RUSTY-KIOSK-SOURCE.txt',
            'bundle-manifest.json',
            'rusty-kiosk-labs-owner-release.json',
            'rusty-kiosk-setup-helper.apk',
            'rusty-kiosk.apk'
          ) | Sort-Object
          if ((@($assets.Name | Sort-Object) -join "`n") -cne ($expectedNames -join "`n")) {
            throw 'Staged Labs asset inventory is not the exact owner-authorized six-file set.'
          }

          Import-Module .\tools\RustyKiosk.LabsReleaseReadback.psm1 -Force

          function Get-TagSnapshot {
            param([Parameter(Mandatory = $true)][string]$Phase)
            $gitRef = gh api "repos/$($env:RELEASE_REPOSITORY)/git/ref/tags/$tag" |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $null -eq $gitRef.object) {
              throw "$Phase tag ref readback failed."
            }
            $gitObject = $gitRef.object
            $seen = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::Ordinal)
            $chain = @()
            for ($depth = 0; $depth -lt 6; $depth++) {
              $type = $gitObject.type
              $sha = $gitObject.sha
              if ($type -cnotin @('tag', 'commit') -or
                $sha -cnotmatch '^[0-9a-fA-F]{40}$') {
                throw "$Phase tag peel contains a malformed object."
              }
              $sha = $sha.ToLowerInvariant()
              if (-not $seen.Add($sha)) {
                throw "$Phase tag peel contains a cycle."
              }
              $chain += "$type`:$sha"
              if ($type -ceq 'commit') {
                break
              }
              $tagObject = gh api "repos/$($env:RELEASE_REPOSITORY)/git/tags/$sha" |
                ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or $null -eq $tagObject.object) {
                throw "$Phase annotated tag readback failed."
              }
              $gitObject = $tagObject.object
            }
            if ($gitObject.type -cne 'commit' -or
              $gitObject.sha.ToLowerInvariant() -cne
                $env:RELEASE_SOURCE_REVISION) {
              throw "$Phase tag did not peel to the exact source commit."
            }
            $commit = gh api (
              "repos/$($env:RELEASE_REPOSITORY)/git/commits/" +
              $env:RELEASE_SOURCE_REVISION) | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or
              $commit.tree.sha -cnotmatch '^[0-9a-fA-F]{40}$' -or
              $commit.tree.sha.ToLowerInvariant() -cne
                $env:RELEASE_SOURCE_TREE) {
              throw "$Phase source-tree readback failed."
            }
            return [pscustomobject]@{
              Chain = @($chain)
              Commit = $gitObject.sha.ToLowerInvariant()
              Tree = $commit.tree.sha.ToLowerInvariant()
            }
          }

          gh release create $tag @($assets.FullName) `
            --title "Rusty Kiosk $tag" `
            --generate-notes `
            --prerelease `
            --draft `
            --verify-tag `
            --target $env:RELEASE_SOURCE_REVISION
          if ($LASTEXITCODE -ne 0) { throw "Failed to create Labs draft $tag." }

          $draftPages = gh api --paginate --slurp `
            "repos/$($env:RELEASE_REPOSITORY)/releases?per_page=100" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to enumerate the authenticated Labs draft."
          }
          $draftMatches = @(
            $draftPages | ForEach-Object { $_ } | Where-Object {
              $_.tag_name -ceq $tag -and $_.draft -eq $true
            }
          )
          if ($draftMatches.Count -ne 1) {
            throw "Expected exactly one authenticated Labs draft for $tag."
          }
          $draft = $draftMatches[0]
          $draftRelease = Assert-RustyKioskLabsReleaseReadback `
            -Release $draft -Assets $assets -ExpectedNames $expectedNames `
            -Repository $env:RELEASE_REPOSITORY -Tag $tag `
            -SourceRevision $env:RELEASE_SOURCE_REVISION `
            -ExpectedDraft $true -Phase 'Pre-promotion draft'
          $draftTag = Get-TagSnapshot -Phase 'Pre-promotion draft'

          gh api --method PATCH `
            "repos/$($env:RELEASE_REPOSITORY)/releases/$($draftRelease.ReleaseId)" `
            -F draft=false -F prerelease=true -f make_latest=false | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to promote verified Labs draft $tag; preserve it for owner review."
          }

          $published = gh api `
            "repos/$($env:RELEASE_REPOSITORY)/releases/$($draftRelease.ReleaseId)" |
            ConvertFrom-Json
          $liveRelease = Assert-RustyKioskLabsReleaseReadback `
            -Release $published -Assets $assets -ExpectedNames $expectedNames `
            -Repository $env:RELEASE_REPOSITORY -Tag $tag `
            -SourceRevision $env:RELEASE_SOURCE_REVISION `
            -ExpectedDraft $false -Phase 'Post-promotion live'
          $publishedByTag = gh api `
            "repos/$($env:RELEASE_REPOSITORY)/releases/tags/$tag" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
            [int64]$publishedByTag.id -ne $liveRelease.ReleaseId) {
            throw 'Published Labs tag route differs from the promoted release ID.'
          }
          $liveTag = Get-TagSnapshot -Phase 'Post-promotion live'
          if ($draftRelease.ReleaseId -ne $liveRelease.ReleaseId -or
            ($draftRelease.Assets -join "`n") -cne
              ($liveRelease.Assets -join "`n") -or
            ($draftTag.Chain -join "`n") -cne ($liveTag.Chain -join "`n") -or
            $draftTag.Commit -cne $liveTag.Commit -or
            $draftTag.Tree -cne $liveTag.Tree) {
            throw 'Labs release or Git source identity drifted across promotion.'
          }

          $PSNativeCommandUseErrorActionPreference = $false
          $latestResponse = @(
            gh api -i "repos/$($env:RELEASE_REPOSITORY)/releases/latest" `
              --jq .tag_name 2>&1
          )
          $latestExit = $LASTEXITCODE
          $latestText = $latestResponse -join "`n"
          if ($latestExit -ne 0) {
            if ($latestText -notmatch '(?m)^HTTP/\S+\s+404\b') {
              throw "Latest-release readback failed without authoritative 404.`n$latestText"
            }
          } else {
            $latestTag = @(
              $latestResponse | Where-Object {
                $_.ToString().Trim() -match '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$'
              }
            )
            if ($latestTag.Count -ne 1 -or $latestTag[0].ToString().Trim() -ceq $tag) {
              throw 'Latest-release readback was malformed or selected the Labs tag.'
            }
          }
          $global:LASTEXITCODE = 0

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'rusty-kiosk-release.jks') -Force -ErrorAction SilentlyContinue
